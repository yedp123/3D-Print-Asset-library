[package]
name = "bambu-asset-manager"
version = "0.1.0"
description = "Bambu Studio 3D Asset & Filament Manager"
authors = ["WonderLabs"]
edition = "2021"

[lib]
name = "bambu_asset_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dunce = "1.0"
zip = "9.0"
roxmltree = "0.20"
